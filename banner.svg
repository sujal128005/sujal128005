<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-label="NEXARA9 — Karthik Panuganti, AI Engineer">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#f5c542"/>
      <stop offset="72%" stop-color="#c8971f"/>
      <stop offset="100%" stop-color="#7a5c12"/>
    </linearGradient>
    <linearGradient id="goldSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a87e19"/>
      <stop offset="45%"  stop-color="#fff3c4"/>
      <stop offset="55%"  stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#a87e19"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#f5c542" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="#050505"/>
    <rect width="1000" height="340" fill="url(#glow)"/>

    <g stroke="#e8c25a" stroke-width="0.5" opacity="0.06">
      <path d="M0 40 H1000 M0 80 H1000 M0 120 H1000 M0 160 H1000 M0 200 H1000 M0 240 H1000 M0 280 H1000 M0 320 H1000"/>
      <path d="M40 0 V340 M120 0 V340 M200 0 V340 M280 0 V340 M360 0 V340 M440 0 V340 M520 0 V340 M600 0 V340 M680 0 V340 M760 0 V340 M840 0 V340 M920 0 V340"/>
    </g>

    <g fill="#f5c542">
      <circle cx="140" cy="300" r="1.4"><animate attributeName="cy" values="320;30" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="300" r="1.1"><animate attributeName="cy" values="330;20" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="300" r="1.2"><animate attributeName="cy" values="340;40" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <g transform="translate(72,72)" filter="url(#soft)">
      <path d="M64 150 L64 60 Q64 30 94 30 L150 30 Q180 30 180 60 L180 110 Q180 140 150 140 L94 140 M180 96 L112 250"
            fill="none" stroke="url(#goldSweep)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="720" stroke-dashoffset="720">
        <animate attributeName="stroke-dashoffset" from="720" to="0" dur="2.4s" begin="0.3s" fill="freeze"/>
      </path>
      <path d="M64 150 L64 60 Q64 30 94 30 L150 30 Q180 30 180 60 L180 110 Q180 140 150 140 L94 140 M180 96 L112 250"
            fill="none" stroke="#fff6d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"
            stroke-dasharray="720" stroke-dashoffset="720">
        <animate attributeName="stroke-dashoffset" from="720" to="0" dur="2.4s" begin="0.3s" fill="freeze"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" begin="2.7s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(320,118)">
      <text x="0" y="0" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
            font-size="60" font-weight="900" letter-spacing="8" fill="url(#goldSweep)" opacity="0">
        NEXARA<tspan fill="url(#gold)">9</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.6s" fill="freeze"/>
      </text>
      <rect x="2" y="14" width="0" height="3" fill="url(#gold)">
        <animate attributeName="width" from="0" to="470" dur="1.1s" begin="2s" fill="freeze"/>
      </rect>
    </g>

    <g transform="translate(322,168)" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="16">
      <text x="0" y="18" opacity="0">
        <tspan fill="#c8971f">karthik@nexara9</tspan><tspan fill="#e9e2c9">:</tspan><tspan fill="#8fb4ff">~</tspan><tspan fill="#e9e2c9">$ whoami</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.6s" fill="freeze"/>
      </text>
      <text x="0" y="46" fill="#e9e2c9" opacity="0">
        Karthik Panuganti &#8212; AI Engineer &#183; Hyderabad, India
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
      </text>
      <text x="0" y="72" opacity="0">
        <tspan fill="#7fd88a">status</tspan><tspan fill="#9aa">: Building &#183; Learning &#183; Shipping</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.5s" fill="freeze"/>
      </text>
      <text x="0" y="98" opacity="0">
        <tspan fill="#7fd88a">stack</tspan><tspan fill="#9aa">&#160;: Agentic AI &#183; LLMs &#183; RAG &#183; LangGraph</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.9s" fill="freeze"/>
      </text>
      <rect x="343" y="85" width="9" height="16" fill="#f5c542">
        <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g stroke="#c8971f" stroke-width="2" fill="none" opacity="0.8">
      <path d="M14 34 V16 H32"/><path d="M986 34 V16 H968"/>
      <path d="M14 306 V324 H32"/><path d="M986 306 V324 H968"/>
    </g>
  </g>
</svg>
