<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-label="SUJAL NEGI — Autonomous Systems Engineer">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#c8fff4"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0a3844"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0e7490"/>
      <stop offset="45%"  stop-color="#c8fff4"/>
      <stop offset="55%"  stop-color="#c8fff4"/>
      <stop offset="100%" stop-color="#0e7490"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="16%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radarFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="#04070a"/>
    <rect width="1000" height="340" fill="url(#glow)"/>

    <!-- engineering grid -->
    <g stroke="#3ee6ff" stroke-width="0.5" opacity="0.07">
      <path d="M0 40 H1000 M0 80 H1000 M0 120 H1000 M0 160 H1000 M0 200 H1000 M0 240 H1000 M0 280 H1000 M0 320 H1000"/>
      <path d="M40 0 V340 M120 0 V340 M200 0 V340 M280 0 V340 M360 0 V340 M440 0 V340 M520 0 V340 M600 0 V340 M680 0 V340 M760 0 V340 M840 0 V340 M920 0 V340"/>
    </g>

    <!-- ============ LiDAR / RADAR SWEEP (the signature) ============ -->
    <g transform="translate(160,170)">
      <!-- concentric range rings -->
      <circle r="120" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>
      <circle r="88"  fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.18"/>
      <circle r="56"  fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.22"/>
      <circle r="24"  fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.28"/>
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#22d3ee" stroke-width="0.6" opacity="0.15"/>
      <line x1="0" y1="-120" x2="0" y2="120" stroke="#22d3ee" stroke-width="0.6" opacity="0.15"/>
      <!-- rotating sweep wedge -->
      <g>
        <path d="M0 0 L120 0 A120 120 0 0 1 84 84 Z" fill="url(#radarFade)"/>
        <line x1="0" y1="0" x2="120" y2="0" stroke="#c8fff4" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </g>
      <!-- detected point blips -->
      <circle cx="60" cy="-40" r="3" fill="#c8fff4"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="-70" cy="30" r="3" fill="#c8fff4"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="90" r="3" fill="#c8fff4"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.2s" repeatCount="indefinite"/></circle>
      <circle r="5" fill="#22d3ee"/>
    </g>

    <!-- ============ WORDMARK ============ -->
    <g transform="translate(340,120)">
      <text x="0" y="0" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
            font-size="54" font-weight="900" letter-spacing="6" fill="url(#sweep)" opacity="0">
        SUJAL NEGI
        <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.4s" fill="freeze"/>
      </text>
      <rect x="2" y="14" width="0" height="3" fill="url(#cyan)">
        <animate attributeName="width" from="0" to="440" dur="1.1s" begin="1.8s" fill="freeze"/>
      </rect>
    </g>

    <!-- ============ TERMINAL BOOT ============ -->
    <g transform="translate(342,168)" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="15">
      <text x="0" y="18" opacity="0">
        <tspan fill="#0e7490">sujal@autonomy</tspan><tspan fill="#e6f7fb">:</tspan><tspan fill="#8fb4ff">~</tspan><tspan fill="#e6f7fb">$ ./boot --systems</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.4s" fill="freeze"/>
      </text>
      <text x="0" y="44" fill="#e6f7fb" opacity="0">
        Sujal Negi &#8212; Autonomous Systems &#183; Mechanical Engineer
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.9s" fill="freeze"/>
      </text>
      <text x="0" y="68" opacity="0">
        <tspan fill="#5eead4">stack</tspan><tspan fill="#9fb3bb">&#160;: LiDAR &#183; SLAM &#183; ROS 2 &#183; PX4 &#183; OpenCV</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.3s" fill="freeze"/>
      </text>
      <text x="0" y="92" opacity="0">
        <tspan fill="#5eead4">status</tspan><tspan fill="#9fb3bb">: IIITDM Kurnool &#183; Building autonomy</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.7s" fill="freeze"/>
      </text>
      <rect x="333" y="79" width="9" height="15" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g stroke="#0e7490" stroke-width="2" fill="none" opacity="0.8">
      <path d="M14 34 V16 H32"/><path d="M986 34 V16 H968"/>
      <path d="M14 306 V324 H32"/><path d="M986 306 V324 H968"/>
    </g>
  </g>
</svg>
